[project]
name = "rocola-prep"
version = "0.1.0"
description = "Rocola's song half: scrobbles in, a glossed teach set out."
readme = "README.md"

# Upper bound: spaCy 3.8 ships no cp314 wheels, so 3.14 would compile
# spacy/thinc/blis from source. Repeated from molcajete-prep rather than
# inherited, because a `requires-python` that disagreed with its dependency's
# would only surface as a resolution failure.
#
# Lower bound: 3.12, where molcajete-prep says 3.11. lingua-language-detector
# 2.2 requires >=3.12, and a narrower floor than a dependency's is fine — the
# reverse is what breaks. Nothing here needs 3.11.
requires-python = ">=3.12,<3.14"

dependencies = [
    # The language half, shared with Molcajete: lemmatisation, the lexicon,
    # glossing, the teach rules, the Anki seed. Version range here, local path
    # below. CLAUDE.md §4: never fork, vendor or copy code out of it.
    "molcajete-prep>=0.1,<0.2",
    # Re-declared even though molcajete-prep depends on it too. `tool.uv.sources`
    # is not carried in published metadata, so the URL below is the only thing
    # that can satisfy this — a consumer inheriting the bare requirement from
    # molcajete-prep would look on PyPI and fail. Molcajete learned this the
    # expensive way; see docs/molcajete-CLAUDE.md.
    "es-core-news-sm",
    # SPEC §7.3's language filter, restricted at construction to the seven
    # languages worth discriminating between. Preferred over fasttext because
    # it is better on short text, and a song is short text.
    #
    # It is a ~170 MB wheel: the models for every language it knows ship in the
    # package whether or not you build a detector that uses them. Desktop-only,
    # never near the app bundle. SPEC §7.3 names fasttext as the alternative if
    # that ever stops being an acceptable trade.
    "lingua-language-detector>=2.2",
    # Declared rather than inherited. It arrives transitively through anthropic
    # today, which means the day anthropic drops it or moves to something else,
    # every HTTP client in this package breaks for a reason with no visible
    # connection to the change.
    "httpx>=0.28",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
# Editable, by path, while all three repos are moving: edit the package and
# this suite sees it with no reinstall. `[project.dependencies]` above carries
# the version range, which is what a release would resolve against — swap this
# entry for `{ git = "…", tag = "v0.2.0" }` when the package settles, and bump
# it deliberately rather than floating it (CLAUDE.md §4).
#
# One `..`, not two: this pyproject sits at the repo root, where Molcajete's
# sits a level down in `pipeline/`.
molcajete-prep = { path = "../molcajete-prep", editable = true }
# The spaCy models are not on PyPI; they are released as wheels on GitHub.
# Pinned to the same 3.8.0 Molcajete uses — a different model version means
# different lemmas, and therefore a different teach set for the same words.
es-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/es_core_news_sm-3.8.0/es_core_news_sm-3.8.0-py3-none-any.whl" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rocola_prep"]
